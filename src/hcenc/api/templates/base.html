<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}HC Encyclopedia{% endblock %}</title>
    <style>
        :root {
            --bg: #171a21;
            --panel: #1f2430;
            --panel-2: #262c3a;
            --text: #e8e6e3;
            --muted: #9aa0ae;
            --accent: #d4a643;
            --accent-2: #5ba861;
            --border: #323a4a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        header {
            background: var(--panel);
            border-bottom: 2px solid var(--accent);
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 24px;
            height: 54px;
        }
        header .brand {
            font-weight: 700;
            font-size: 18px;
            color: var(--accent);
            letter-spacing: 0.5px;
        }
        nav { display: flex; gap: 18px; }
        nav a { color: var(--text); padding: 6px 2px; border-bottom: 2px solid transparent; }
        nav a:hover { color: var(--accent); text-decoration: none; border-color: var(--accent); }
        main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }
        h1 { font-size: 24px; margin: 8px 0 16px; }
        h2 { font-size: 18px; margin: 24px 0 10px; color: var(--accent); }
        table.list {
            width: 100%;
            border-collapse: collapse;
            background: var(--panel);
        }
        table.list th, table.list td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            vertical-align: middle;
        }
        table.list th { color: var(--muted); font-weight: 600; font-size: 13px; }
        table.list tr:hover td { background: var(--panel-2); }
        img.thumb {
            width: 40px; height: 40px;
            object-fit: contain;
            background: rgba(255,255,255,0.04);
            border-radius: 4px;
        }
        img.big {
            width: 170px; height: 170px;
            object-fit: contain;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
        }
        form.filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        form.filters input[type="text"], form.filters select {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 10px;
            min-width: 180px;
        }
        form.filters button {
            background: var(--accent);
            color: #1b1b1b;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            padding: 7px 18px;
            cursor: pointer;
        }
        .muted { color: var(--muted); }
        .badge {
            display: inline-block;
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 10px;
            padding: 1px 9px;
            font-size: 12px;
            margin-right: 4px;
        }
        .pager {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 16px;
        }
        .pager a, .pager span {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 5px 12px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .card img { width: 96px; height: 96px; object-fit: contain; align-self: center; }
        .card .name { font-weight: 600; text-align: center; }
        .card .sub { text-align: center; color: var(--muted); font-size: 13px; }
        .detail-grid {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 24px;
            align-items: start;
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
        }
        .kv { width: 100%; border-collapse: collapse; }
        .kv td { padding: 5px 8px; border-bottom: 1px solid var(--border); }
        .kv td:first-child { color: var(--muted); width: 40%; }
        .bonus {
            background: var(--panel);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent-2);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .bonus .label { color: var(--accent-2); font-weight: 700; margin-bottom: 6px; }
        .bonus.red { border-left-color: #c0504d; }
        .bonus.red .label { color: #e07b78; }
        .bonus.yellow { border-left-color: #d4a643; }
        .bonus.yellow .label { color: #e6c367; }
        .bonus.purple { border-left-color: #9a6fc0; }
        .bonus.purple .label { color: #bd96e0; }
        .mats { display: flex; flex-wrap: wrap; gap: 12px; }
        .mat {
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            text-align: center;
            font-size: 13px;
        }
        .mat img { width: 52px; height: 52px; object-fit: contain; display: block; margin: 0 auto 4px; }
        .equip-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
            grid-template-areas:
                "ws set set w"
                "as set set ar"
                "t r a art";
        }
        .equip-cell.set-cell {
            border-style: solid;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .equip-cell.set-cell img {
            width: 96px; height: 96px;
        }
        .equip-cell.set-cell .ph {
            width: 96px; height: 96px;
        }
        .equip-cell.set-cell .nm { margin-top: 4px; }
        .equip-cell {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 4px 6px;
            text-align: center;
            min-height: 78px;
        }
        .equip-cell img {
            width: 52px; height: 52px;
            object-fit: contain;
        }
        .equip-cell .ph {
            width: 52px; height: 52px;
            margin: 0 auto;
            border: 1px dashed var(--border);
            border-radius: 6px;
        }
        .equip-cell.empty { border-style: dashed; }
        .equip-cell .lbl {
            color: var(--muted);
            font-size: 10px;
            margin-top: 3px;
        }
        .equip-cell .nm { font-size: 11px; line-height: 1.25; }

        .tip {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            background: #10141c;
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 10px 12px;
            z-index: 60;
            text-align: left;
            box-shadow: 0 8px 24px rgba(0,0,0,.55);
            font-size: 12px;
            line-height: 1.45;
        }
        .equip-cell:hover .tip { display: block; }
        .tip .tip-name {
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 4px;
        }
        .tip .tip-meta {
            color: var(--muted);
            margin-bottom: 6px;
        }
        .tip .tip-desc {
            white-space: pre-wrap;
            border-top: 1px solid var(--border);
            padding-top: 6px;
        }
        .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
        .stat-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            text-align: center;
        }
        .stat-card .num { font-size: 32px; font-weight: 700; color: var(--accent); }
        .stat-card .label { color: var(--muted); margin-top: 4px; }
        .back { margin-bottom: 14px; display: inline-block; }
        footer {
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
            text-align: center;
            padding: 16px;
        }
        @media (max-width: 720px) {
            .detail-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <span class="brand">HC Encyclopedia</span>
        <nav>
            <a href="/">Главная</a>
            <a href="/items">Предметы</a>
            <a href="/sets">Сеты</a>
            <a href="/runes">Руны</a>
            <a href="/units">Отряд</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>Данные: sagehc.eu · HC Encyclopedia</footer>
</body>
</html>
