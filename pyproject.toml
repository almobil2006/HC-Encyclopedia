[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcenc"
version = "2.0.0a0"
description = "HC Encyclopedia"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "typer>=0.16",
    "rich",
    "requests",
    "beautifulsoup4",
    "sqlalchemy>=2.0",
    "PyYAML",
    "pytest",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hcenc = ["api/templates/*.html"]

[project.scripts]
hcenc = "hcenc.cli.app:app"
